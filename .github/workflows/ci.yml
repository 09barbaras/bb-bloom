name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bb_bloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bb_bloom"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    # No DATABASE_URL needed: the defaults in app/config.py point at localhost:5432,
    # which is this service.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version; --locked fails if uv.lock is out of date.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # The service only creates bb_bloom; tests use their own bb_bloom_test (same script as docker compose).
      - name: Create the test database
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f docker/create-test-db.sql

      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
