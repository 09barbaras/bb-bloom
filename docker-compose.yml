# `docker compose up` starts Postgres, the API (with migrations) and the React dev server.
#   App:       http://localhost:5173
#   API docs:  http://localhost:8000/docs

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bb_bloom
    ports:
      - "5432:5432" # lets you connect with psql / TablePlus from your machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/bb_bloom
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/bb_bloom_test
    # --reload restarts the server when you save a .py file (like Rails in development)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules # keep Linux node_modules separate from your Mac's
    depends_on:
      - api

volumes:
  pgdata:
  node_modules:
