[project]
name = "bb-bloom-backend"
version = "0.1.0"
description = "BB Bloom API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]
